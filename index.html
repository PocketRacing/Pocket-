<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

  <title>Kartaviy City</title>

  <link rel="stylesheet" href="style.css">

  <!-- Three.js -->
  <script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
</head>

<body>

  <!-- Главное меню -->
  <div id="mainMenu" class="screen">
    <div class="menu-box">
      <h1>KARTAVIY CITY</h1>
      <p>Построй свой город</p>

      <button id="startGame">Начать игру</button>
      <button id="loadGame">Загрузить город</button>
    </div>
  </div>

  <!-- Игровой интерфейс -->
  <div id="gameInterface" class="hidden">

    <header class="top-bar">
      <div class="city-name">Мой город</div>

      <div class="resources">
        <span>💰 <b id="money">50000</b> ₽</span>
        <span>👥 <b id="population">0</b></span>
        <span>⭐ Ур. <b id="level">1</b></span>
      </div>
    </header>

    <!-- Сообщения игры -->
    <div id="notification"></div>

    <!-- Игровой экран -->
    <main id="gameContainer"></main>

    <!-- Меню строительства -->
    <section id="constructionMenu" class="construction-menu">

      <button class="build-button" data-building="road">
        🛣️<span>Дорога</span>
      </button>

      <button class="build-button" data-building="house">
        🏠<span>Дом</span>
      </button>

      <button class="build-button" data-building="shop">
        🏪<span>Магазин</span>
      </button>

      <button class="build-button" data-building="school">
        🏫<span>Школа</span>
      </button>

      <button class="build-button" data-building="hospital">
        🏥<span>Больница</span>
      </button>

      <button class="build-button" data-building="park">
        🌳<span>Парк</span>
      </button>

      <button class="build-button" data-building="bridge">
        🌉<span>Мост</span>
      </button>

      <button class="build-button" data-building="bulldozer">
        🚜<span>Убрать</span>
      </button>

      <button id="walkModeButton" class="build-button">
        🚶<span>Прогулка</span>
      </button>
    </section>

    <!-- Управление прогулкой -->
    <div id="walkControls" class="hidden">

      <div id="joystick">
        <div id="joystickKnob"></div>
      </div>

      <button id="interactButton">Взаимодействовать</button>
      <button id="exitWalkButton">Выйти</button>

    </div>

    <!-- Задания -->
    <aside id="missionsPanel">
      <h3>📋 Задания</h3>
      <p id="missionText">Построй первый дом</p>
      <div>Награда: <span id="missionReward">1000</span> ₽</div>
    </aside>

    <!-- Подтверждение удаления -->
    <div id="confirmBox" class="hidden">
      <h3>Удалить препятствия?</h3>
      <p id="confirmText">
        На территории находятся деревья или камни.
      </p>

      <button id="confirmRemove">Подтвердить</button>
      <button id="cancelRemove">Отмена</button>
    </div>

  </div>

  <!-- Скрипты игры -->
  <script src="save.js"></script>
  <script src="city.js"></script>
  <script src="construction.js"></script>
  <script src="player.js"></script>
  <script src="game.js"></script>

</body>
</html>
