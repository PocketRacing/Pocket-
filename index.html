<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
  >

  <title>Kartaviy City</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <!-- ГЛАВНОЕ МЕНЮ -->
  <div id="mainMenu" style="display: flex;">

    <h1>Kartaviy City</h1>

    <p>Построй свой город</p>

    <button id="startGame">
      Начать игру
    </button>

    <button id="loadGame">
      Загрузить игру
    </button>

  </div>


  <!-- ИГРА -->
  <div id="gameInterface" style="display: none;">

    <div id="gameContainer"></div>


    <!-- ВЕРХНЯЯ ПАНЕЛЬ -->
    <div id="topPanel">

      <div class="panel">
        💰 <span id="money">50000</span> ₽
        <br>
        👥 <span id="population">0</span>
      </div>

      <div class="panel">
        ⭐ Уровень: <span id="level">1</span>
        <br>
        📅 День: <span id="day">1</span>
      </div>

    </div>


    <!-- УВЕДОМЛЕНИЯ -->
    <div id="notification"></div>


    <!-- СТРОИТЕЛЬСТВО -->
    <div id="constructionPanel">

      <button class="build-button" data-building="road">
        🛣️ Дорога
      </button>

      <button class="build-button" data-building="house">
        🏠 Дом
      </button>

      <button class="build-button" data-building="shop">
        🏪 Магазин
      </button>

      <button class="build-button" data-building="school">
        🏫 Школа
      </button>

      <button class="build-button" data-building="hospital">
        🏥 Больница
      </button>

      <button class="build-button" data-building="park">
        🌳 Парк
      </button>

      <button class="build-button" data-building="bridge">
        🌉 Мост
      </button>

      <button class="build-button" data-building="bulldozer">
        🗑️ Удалить
      </button>

      <button id="walkModeButton">
        🚶 Прогулка
      </button>

    </div>


    <!-- ПРОГУЛКА И ДЖОЙСТИКИ -->
    <div id="walkControls" style="display: none;">

      <!-- ЛЕВЫЙ ДЖОЙСТИК -->
      <div id="joystick">
        <div id="joystickKnob"></div>
      </div>

      <!-- ПРАВЫЙ ДЖОЙСТИК -->
      <div id="cameraJoystick">
        <div id="cameraJoystickKnob"></div>
      </div>

      <button id="interactButton">
        Взаимодействие
      </button>

      <button id="exitWalkButton">
        Выйти
      </button>

    </div>


    <!-- ЗАДАНИЯ -->
    <div id="missionsPanel" style="display: none;">

      <h3>📋 Задания</h3>

      <div id="missionsList"></div>

    </div>


    <!-- ПОДТВЕРЖДЕНИЕ -->
    <div id="confirmBox" style="display: none;">

      <p id="confirmText"></p>

      <button id="confirmYes">
        Подтвердить
      </button>

      <button id="confirmNo">
        Отмена
      </button>

    </div>

  </div>


  <!-- THREE.JS -->
  <script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>


  <!-- ФАЙЛЫ ИГРЫ -->
  <script src="save.js"></script>
  <script src="city.js"></script>
  <script src="construction.js"></script>
  <script src="player.js"></script>
  <script src="missions.js"></script>
  <script src="economy.js"></script>
  <script src="weather.js"></script>
  <script src="vehicles.js"></script>
  <script src="interiors.js"></script>
  <script src="game.js"></script>

</body>
</html>
